[env]
DEFMT_LOG = "trace"

[build]
target = "thumbv8m.main-none-eabihf"

[target.thumbv8m.main-none-eabihf]
runner = "probe-rs run --chip STM32WBA65RI --connect-under-reset --scan-region ram"
rustflags = [
    "-C",
    "target-feature=+dsp",
    "-C",
    "link-arg=-Tlink.x",
    "-C",
    "link-arg=-Tdefmt.x",
]
