[package]
name = "embedded-nn-stm32wba65ri"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.5"
defmt = "1.0.1"
defmt-rtt = "1.3.0"
embassy-stm32 = { version = "0.6.0", features = ["defmt", "memory-x", "stm32wba65ri"] }
embedded-nn = { path = "../../crates/embedded-nn", default-features = false, features = ["libm"] }
embedded-nn-macros = { path = "../../crates/embedded-nn-macros" }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
