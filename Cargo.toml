[workspace]
resolver = "2"
members = [
    "crates/embedded-nn",
    "crates/embedded-nn-compiler",
    "crates/embedded-nn-codegen",
    "crates/embedded-nn-macros",
    "crates/embedded-nn-live",
    "crates/embedded-nn-cli",
    "crates/embedded-nn-studio",
    "crates/embedded-nn-tflite",
    "crates/embedded-nn-train",
    "crates/embedded-nn-litert-plugin",
]
exclude = [
    "examples/qemu-lm3s6965",
    "examples/stm32wba65ri",
    "examples/rp2040-pico",
    "examples/embassy-rp2040",
    "examples/keyword-spotting",
    "examples/vibration-anomaly",
    "examples/imu-gesture",
    "examples/subbyte-quantization",
]

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.98"
authors = ["Gerzain Mata <leftger@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/leftger/embedded-nn"
readme = "README.md"

[workspace.dependencies]
embedded-nn = { path = "crates/embedded-nn", version = "0.2.2", default-features = false }
embedded-nn-compiler = { path = "crates/embedded-nn-compiler", version = "0.2.2" }
embedded-nn-codegen = { path = "crates/embedded-nn-codegen", version = "0.2.2" }
embedded-nn-macros = { path = "crates/embedded-nn-macros", version = "0.2.2" }
embedded-nn-live = { path = "crates/embedded-nn-live", version = "0.2.2" }
embedded-nn-tflite = { path = "crates/embedded-nn-tflite", version = "0.2.2" }
embedded-nn-train = { path = "crates/embedded-nn-train", version = "0.2.2" }

libm = { version = "0.2.11" }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
thiserror = "2.0"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3.0", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
criterion = { version = "0.8" }
embedded-dsp = { version = "0.5.1", default-features = false, features = ["libm"] }
flatbuffers = "25.12"

eframe = { version = "0.36", default-features = true }
egui_extras = { version = "0.36" }
rfd = "0.17"
nusb = "0.2"
