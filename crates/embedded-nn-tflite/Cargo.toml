[package]
name = "embedded-nn-tflite"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "TensorFlow Lite (.tflite) FlatBuffers importer for embedded-nn"
include = ["/src/**", "/schema/**", "/tests/**", "/fixtures/**", "/Cargo.toml"]

[features]
fixture-generation = []

[dependencies]
embedded-nn-compiler = { workspace = true }
flatbuffers = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
embedded-nn = { workspace = true, features = ["float"] }
embedded-nn-codegen = { workspace = true }

[[example]]
name = "generate_constructed_fixtures"
required-features = ["fixture-generation"]
