[package]
name = "embedded-nn"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "A pure Rust, #![no_std] neural network inference library inspired by CMSIS-NN for microcontrollers and embedded targets."
readme = "../../README.md"
keywords = ["no-std", "embedded", "cmsis-nn", "neural-network", "quantization"]
categories = ["embedded", "science", "no-std"]

[features]
default = ["libm"]
alloc = []
float = []
simd = []
libm = ["dep:libm"]
dsp = ["dep:embedded-dsp", "libm"]

[dependencies]
libm = { workspace = true, optional = true }
embedded-dsp = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "kernels"
harness = false

[[example]]
name = "keyword_spotting"
required-features = ["dsp", "libm"]

[[example]]
name = "gesture_recognition"
required-features = ["libm"]

