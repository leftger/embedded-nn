[package]
name = "embedded-nn-studio"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Cross-platform interactive TinyML Studio for embedded-nn (Ingest, Train, Quantize, Arena & Codegen)"

[[bin]]
name = "embedded-nn-studio"
path = "src/main.rs"

[dependencies]
embedded-nn = { workspace = true, features = ["alloc", "float", "libm", "dsp"] }
embedded-nn-compiler = { workspace = true }
embedded-nn-codegen = { workspace = true }
embedded-nn-live = { workspace = true }
embedded-nn-tflite = { workspace = true }
embedded-nn-train = { workspace = true }
eframe = { workspace = true }
egui_extras = { workspace = true }
rfd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nusb = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlCanvasElement",
    "Navigator", "WorkerNavigator", "Usb", "UsbDevice", "UsbRequestType",
    "UsbRecipient", "UsbDirection", "UsbTransferStatus",
    "UsbControlTransferParameters", "UsbInTransferResult", "UsbOutTransferResult",
    "UsbConfiguration", "UsbInterface", "UsbAlternateInterface", "UsbEndpoint"
] }
getrandom = { version = "0.3", features = ["wasm_js"] }
