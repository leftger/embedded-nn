[package]
name = "embedded-nn-live"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Live USB streaming, sensor ingestion & HIL verification protocol for embedded-nn"

[features]
default = ["std"]
std = ["dep:serde", "serde/std", "dep:nusb", "dep:serde_json", "dep:thiserror"]

[dependencies]
serde = { workspace = true, default-features = false, features = ["alloc", "derive"], optional = true }
serde_json = { workspace = true, optional = true }
nusb = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
