name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Create GitHub Release & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev

      - name: Build CLI binary (enn)
        run: |
          cargo build --release -p embedded-nn-cli
          tar -czf enn-linux-x86_64.tar.gz -C target/release enn

      - name: Build Studio binary (embedded-nn-studio)
        run: |
          cargo build --release -p embedded-nn-studio
          tar -czf embedded-nn-studio-linux-x86_64.tar.gz -C target/release embedded-nn-studio

      - name: Publish to crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p embedded-nn --token "${CARGO_REGISTRY_TOKEN}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            enn-linux-x86_64.tar.gz
            embedded-nn-studio-linux-x86_64.tar.gz
