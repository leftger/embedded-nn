# Score only the core embedded-nn crate. Sibling crates (live, studio, cli, …)
# and non-library trees are excluded from Codecov.
ignore:
  - "crates/embedded-nn-*/**"
  - "examples/**"
  - "analysis/**"
  - "assets/**"
  - "docs/**"

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        paths:
          - crates/embedded-nn
    patch:
      default:
        target: 60%
        threshold: 1%
        paths:
          - crates/embedded-nn
